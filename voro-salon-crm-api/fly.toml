# fly.toml app configuration file generated for voro-salon-crm-api on 2026-03-04T20:56:45-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voro-salon-crm-api'
primary_region = 'gru'

[build]

# Migration + seed rodam aqui, uma vez por deploy, em vez de a cada boot da aplicacao.
# Ver issue #114.
[deploy]
  release_command = "dotnet VoroSalonCrm.API.dll --migrate"
  # Padrao do Fly e 5 min. O CREATE INDEX CONCURRENTLY em RouteAuditLogs (tabela que
  # nunca teve expurgo) pode passar disso; estourando, a maquina de release e morta e
  # o Postgres fica com indice INVALID. Ver issue #115.
  release_command_timeout = "15m"

[http_service]
  internal_port = 8080
  force_https = true
  # min_machines_running = 1 mantem uma maquina sempre de pe. Com 0, a primeira requisicao
  # apos ociosidade pagava o boot completo: 22s de TTFB medidos em producao (issue #114).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
