# fly.dev.toml — ambiente de desenvolvimento (branch dev)
# App: dev-voro-salon-crm-api

app = 'dev-voro-salon-crm-api'
primary_region = 'gru'

[build]

# Migration + seed rodam aqui, uma vez por deploy, em vez de a cada boot (issue #114).
[deploy]
  release_command = "dotnet VoroSalonCrm.API.dll --migrate"
  # Padrao do Fly e 5 min. O CREATE INDEX CONCURRENTLY em RouteAuditLogs (tabela que
  # nunca teve expurgo) pode passar disso; estourando, a maquina de release e morta e
  # o Postgres fica com indice INVALID. Ver issue #115.
  release_command_timeout = "15m"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Dev continua dormindo de proposito: cold start aqui e aceitavel, custo importa mais.
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
