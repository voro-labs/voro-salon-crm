# fly.dev.toml — ambiente de desenvolvimento (branch dev)
# App: dev-voro-salon-crm-api

app = 'dev-voro-salon-crm-api'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
