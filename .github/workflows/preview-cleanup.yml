name: Fly Preview Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  scale-down-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scale preview app to 0 machines
        run: |
          APP_NAME="dev-${{ github.event.repository.name }}-api"
          if flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
            flyctl scale count 0 -a "$APP_NAME"
            echo "App $APP_NAME pausado (0 machines)."
          else
            echo "App $APP_NAME não existe — nada a fazer."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.GLOBAL_FLY_API_TOKEN }}
