name: Run Tests on PR

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      # ================================================
      # TOKEN DO GITHUB APP
      # ================================================
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          installation_id: ${{ secrets.BOT_INSTALLATION_ID }}
          private_key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Restore dependencies
        run: |
          cd ${{ secrets.FOLDER__API }}
          dotnet restore

      - name: Build solution
        run: |
          cd ${{ secrets.FOLDER__API }}
          dotnet build --no-restore --configuration Release

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: |
          mkdir -p /tmp/test_results
          cd ${{ secrets.FOLDER__API }}
          dotnet test --no-build --configuration Release --verbosity normal \
            --logger "trx" \
            --results-directory /tmp/test_results \
            2>&1 | tee /tmp/test_output.txt
          echo "test_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Parse test results
        id: results
        run: |
          PASSED=0
          FAILED=0
          TOTAL=0

          for f in /tmp/test_results/*.trx; do
            [ -f "$f" ] || continue
            LINE=$(grep '<Counters' "$f")
            P=$(echo "$LINE" | grep -oP 'passed="\K[0-9]+')
            F=$(echo "$LINE" | grep -oP 'failed="\K[0-9]+')
            T=$(echo "$LINE" | grep -oP 'total="\K[0-9]+')
            PASSED=$((PASSED + ${P:-0}))
            FAILED=$((FAILED + ${F:-0}))
            TOTAL=$((TOTAL + ${T:-0}))
          done

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          if [ "$FAILED" = "0" ] && [ "$TOTAL" != "0" ]; then
            echo "status=🟢 Passed" >> $GITHUB_OUTPUT
          elif [ "$FAILED" != "0" ]; then
            echo "status=🔴 Failed" >> $GITHUB_OUTPUT
          else
            echo "status=⚪ No tests found" >> $GITHUB_OUTPUT
          fi

      # ================================================
      # COMENTÁRIO USANDO O BOT
      # ================================================
      - name: Comment test results on PR
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **🧪 Test results for this PR**

            | Project | Status | Results | Updated (UTC) |
            |---------|--------|---------|---------------|
            | `${{ github.event.repository.name }}` | ${{ steps.results.outputs.status }} | ${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }} passed, ${{ steps.results.outputs.failed }} failed | ${{ github.event.pull_request.updated_at }} |

      - name: Fail workflow if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
