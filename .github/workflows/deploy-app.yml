name: EAS Deploy App

on:
  push:
    branches:
      - main
    paths:
      - 'voro-salon-crm-app/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (development | preview | production)'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: voro-salon-crm-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: voro-salon-crm-app

      - name: Publish EAS Update
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS Update
        run: eas update --auto --non-interactive
        working-directory: voro-salon-crm-app

  build:
    name: EAS Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: voro-salon-crm-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: voro-salon-crm-app

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        run: eas build --platform all --profile ${{ github.event.inputs.profile }} --non-interactive
        working-directory: voro-salon-crm-app
