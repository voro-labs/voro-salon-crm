name: Frontend E2E Tests (PR)

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voro-salon-crm-front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voro-salon-crm-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Prepare auth directory
        run: mkdir -p e2e/fixtures/.auth

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          BOOKING_SLUG: ${{ secrets.BOOKING_SLUG }}
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: voro-salon-crm-front/playwright-report/
          retention-days: 7
