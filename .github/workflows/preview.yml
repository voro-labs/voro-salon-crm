name: Fly Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "voro-salon-crm-api/**"

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # ================================================
      # TOKEN DO GITHUB APP
      # ================================================
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          installation_id: ${{ secrets.BOT_INSTALLATION_ID }}
          private_key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Define preview app name
        id: vars
        run: echo "APP_NAME=dev-${{ github.event.repository.name }}-api" >> $GITHUB_OUTPUT

      - name: Create Fly app (if not exists)
        run: |
          if ! flyctl status -a ${{ steps.vars.outputs.APP_NAME }} >/dev/null 2>&1; then
            flyctl apps create ${{ steps.vars.outputs.APP_NAME }} --org ${{ secrets.FLY_ORG }}
          else
            echo "App ${{ steps.vars.outputs.APP_NAME }} already exists."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.GLOBAL_FLY_API_TOKEN }}

      - name: Set secrets for preview app
        run: |
          cd ${{ secrets.FOLDER__API }}
          flyctl secrets set \
            JWTKEY="${{ secrets.JWTKEY }}" \
            APIKEYS__BIRTHDAYGREETINGS="${{ secrets.BIRTHDAY_API_KEY }}" \
            CONNECTIONSTRING__PRODUCTION__SERVER="${{ secrets.CONNECTIONSTRING__DEVELOPMENT__SERVER }}" \
            CONNECTIONSTRING__PRODUCTION__PORT="${{ secrets.CONNECTIONSTRING__DEVELOPMENT__PORT }}" \
            CONNECTIONSTRING__PRODUCTION__DATABASE="${{ secrets.CONNECTIONSTRING__DEVELOPMENT__DATABASE }}" \
            CONNECTIONSTRING__PRODUCTION__USERID="${{ secrets.CONNECTIONSTRING__DEVELOPMENT__USERID }}" \
            CONNECTIONSTRING__PRODUCTION__PASSWORD="${{ secrets.CONNECTIONSTRING__DEVELOPMENT__PASSWORD }}" \
            EMAILSETTINGS__SMTPSERVER="${{ secrets.EMAILSETTINGS__SMTPSERVER }}" \
            EMAILSETTINGS__SMTPPORT="${{ secrets.EMAILSETTINGS__SMTPPORT }}" \
            EMAILSETTINGS__IMAPSERVER="${{ secrets.EMAILSETTINGS__IMAPSERVER }}" \
            EMAILSETTINGS__IMAPPORT="${{ secrets.EMAILSETTINGS__IMAPPORT }}" \
            EMAILSETTINGS__FROM="${{ secrets.EMAILSETTINGS__FROM }}" \
            EMAILSETTINGS__USERNAME="${{ secrets.EMAILSETTINGS__USERNAME }}" \
            EMAILSETTINGS__PASSWORD="${{ secrets.EMAILSETTINGS__PASSWORD }}" \
            BLOBSETTINGS__TOKEN="${{ secrets.BLOBSETTINGS__TOKEN }}" \
            BLOBSETTINGS__STOREID="${{ secrets.BLOBSETTINGS__STOREID }}" \
            BLOBSETTINGS__BLOBNAME="${{ secrets.BLOBSETTINGS__BLOBNAME }}" \
            MERCADOPAGOSETTINGS__BACKURL="${{ secrets.MERCADOPAGOSETTINGS__BACKURL }}" \
            MERCADOPAGOSETTINGS__ACCESSTOKEN="${{ secrets.MERCADOPAGOSETTINGS__ACCESSTOKEN }}" \
            MERCADOPAGOSETTINGS__WEBHOOKSECRET="${{ secrets.MERCADOPAGOSETTINGS__WEBHOOKSECRET }}" \
            KESTREL__CERTIFICATES__DEVELOPMENT__PASSWORD="${{ secrets.KESTREL__CERTIFICATES__DEVELOPMENT__PASSWORD }}" \
            AISETTINGS__APIKEY="${{ secrets.AISETTINGS__APIKEY }}" \
            OPENAISETTINGS__APIKEY="${{ secrets.OPENAISETTINGS__APIKEY }}" \
            REDIS__CONNECTIONSTRING="${{ secrets.REDIS__CONNECTIONSTRING }}" \
            INTEGRATIONSETTINGS__WHATSAPP__APPID="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__APPID }}" \
            INTEGRATIONSETTINGS__WHATSAPP__CONFIGID="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__CONFIGID }}" \
            INTEGRATIONSETTINGS__WHATSAPP__APPSECRET="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__APPSECRET }}" \
            INTEGRATIONSETTINGS__WHATSAPP__MASTERACCESSTOKEN="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__MASTERACCESSTOKEN }}" \
            INTEGRATIONSETTINGS__WHATSAPP__TOKEN="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__TOKEN }}" \
            INTEGRATIONSETTINGS__WHATSAPP__PHONEID="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__PHONEID }}" \
            INTEGRATIONSETTINGS__WHATSAPP__BUSSINESSID="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__BUSSINESSID }}" \
            INTEGRATIONSETTINGS__WHATSAPP__VERIFYTOKEN="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__VERIFYTOKEN }}" \
            INTEGRATIONSETTINGS__APIPUBLICURL="${{ secrets.INTEGRATIONSETTINGS__DEVELOPMENT__APIPUBLICURL }}" \
            INTEGRATIONSETTINGS__WHATSAPP__EVOLUTIONURL="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__DEVELOPMENT__EVOLUTIONURL }}" \
            INTEGRATIONSETTINGS__WHATSAPP__EVOLUTIONADMINTOKEN="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__EVOLUTIONADMINTOKEN }}" \
            INTEGRATIONSETTINGS__WHATSAPP__PROVIDER="${{ secrets.INTEGRATIONSETTINGS__WHATSAPP__PROVIDER }}" \
            CORSSETTINGS__ALLOWEDORIGINS__0="${{ secrets.CORSSETTINGS__ALLOWEDORIGINS__DEVELOPMENT__0 }}" \
            CORSSETTINGS__ALLOWEDORIGINS__1="${{ secrets.CORSSETTINGS__ALLOWEDORIGINS__DEVELOPMENT__1 }}" \
            CORSSETTINGS__ALLOWEDORIGINS__2="${{ secrets.CORSSETTINGS__ALLOWEDORIGINS__DEVELOPMENT__2 }}" \
            -a ${{ steps.vars.outputs.APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.GLOBAL_FLY_API_TOKEN }}

      - name: Scale up preview app (reativa se estava pausado)
        run: |
          flyctl scale count 1 -a ${{ steps.vars.outputs.APP_NAME }} --yes
        env:
          FLY_API_TOKEN: ${{ secrets.GLOBAL_FLY_API_TOKEN }}

      - name: Deploy preview app
        run: |
          cd ${{ secrets.FOLDER__API }}
          flyctl deploy --remote-only -a ${{ steps.vars.outputs.APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.GLOBAL_FLY_API_TOKEN }}

      # ================================================
      # COMENTÁRIO USANDO O BOT
      # ================================================
      - name: Comment preview URL on PR (Vercel-style)
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ steps.app-token.outputs.token }} # 👈 USA O BOT
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **🚀 Preview environment for this PR**

            | Project | Deployment | Preview | Updated (UTC) |
            |--------|------------|---------|---------------|
            | `${{ github.event.repository.name }}` | 🟢 Deployed | [Preview](${{ secrets.CORSSETTINGS__ALLOWEDORIGINS__DEVELOPMENT__0 }}) | ${{ github.event.pull_request.updated_at }} |
